name: Build Prebuilt Recovery Images

# =============================================================================
# EZ-Modmium — CI workflow that builds prebuilt recovery images for the top
# boards and publishes them as release artifacts with SHA-256 manifests.
#
# This gives users the best of both worlds: offline-friendly recovery images
# with no build step required.
#
# Triggered on:
#   - stable tag push (creates a release)
#   - manual dispatch (workflow_dispatch)
# =============================================================================
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      boards:
        description: 'Space-separated list of boards to build (default: top 12)'
        required: false
        default: ''
      version:
        description: 'ChromeOS milestone (e.g. 138). Leave empty for latest stable.'
        required: false
        default: ''

jobs:
  build-images:
    name: Build recovery images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - corsola
          - nissa
          - dedede
          - geralt
          - brya
          - brask
          - brox
          - cherry
          - guybrush
          - skyrim
          - rauru
          - rex
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acpica-tools coreutils curl jq libarchive-tools pv sed util-linux wget inkscape
          # Bootstrap vboot-utils from source (Ubuntu's package is outdated)
          sudo ./tools/install-deps.sh --bootstrap-vboot || true

      - name: Detect latest stable ChromeOS version
        id: detect-version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Query the releases data for the latest stable version for this board
            VERSION=$(curl -sL "https://cdn.jsdelivr.net/gh/crosbreaker/chromeos-releases-data/data.json" | \
              jq -r --arg board "${{ matrix.board }}" \
              '.[$board].images | map(select(.channel == "stable-channel")) | sort_by(.last_modified) | last | .chrome_version | split(".")[0]')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Detected latest stable for ${{ matrix.board }}: $VERSION"
          fi

      - name: Build recovery image
        run: |
          sudo ./build-image.sh -b ${{ matrix.board }} -v ${{ steps.detect-version.outputs.version }} || {
            echo "::warning::Build failed for ${{ matrix.board }} v${{ steps.detect-version.outputs.version }}"
            exit 0  # Don't fail the whole workflow for one board
          }

      - name: Verify image exists and compute SHA-256
        id: verify
        run: |
          if [[ -f modmium.bin ]]; then
            sha256sum modmium.bin > modmium.bin.sha256
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "sha256=$(awk '{print $1}' modmium.bin.sha256)" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload image artifact
        if: steps.verify.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: modmium-${{ matrix.board }}-v${{ steps.detect-version.outputs.version }}
          path: |
            modmium.bin
            modmium.bin.sha256
          retention-days: 90

      - name: Create release
        if: steps.verify.outputs.exists == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            modmium.bin
            modmium.bin.sha256
          name: EZ-Modmium ${{ github.ref_name }} (${{ matrix.board }})
          body: |
            Prebuilt EZ-Modmium recovery image for board `${{ matrix.board }}`.

            **ChromeOS version:** ${{ steps.detect-version.outputs.version }}
            **SHA-256:** `${{ steps.verify.outputs.sha256 }}`

            ## Usage
            1. Download `modmium.bin`
            2. Verify the SHA-256: `echo "${{ steps.verify.outputs.sha256 }}  modmium.bin" | sha256sum -c`
            3. Flash to USB: `sudo dd if=modmium.bin of=/dev/sdX bs=4M status=progress conv=fsync && sync`
            4. Follow the install guide: [EZ-INSTALL.md](EZ-INSTALL.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish combined manifest
    needs: build-images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: modmium-*

      - name: Build combined manifest
        run: |
          echo "# EZ-Modmium Prebuilt Images — ${{ github.ref_name }}" > MANIFEST.md
          echo "" >> MANIFEST.md
          echo "| Board | ChromeOS Version | SHA-256 |" >> MANIFEST.md
          echo "|-------|------------------|----------|" >> MANIFEST.md
          for dir in artifacts/modmium-*/; do
            [[ -d "$dir" ]] || continue
            board=$(basename "$dir" | sed 's/modmium-//' | sed 's/-v[0-9]*$//')
            version=$(basename "$dir" | sed 's/.*-v//')
            sha=$(awk '{print $1}' "$dir/modmium.bin.sha256" 2>/dev/null || echo "missing")
            echo "| $board | $version | \`$sha\` |" >> MANIFEST.md
          done
          cat MANIFEST.md

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: MANIFEST
          path: MANIFEST.md
