# =============================================================================
# EZ-Modmium configuration file
# =============================================================================
# Centralizes every URL, threshold, flag, and list that was previously
# hardcoded across modmium.sh, build-image.sh, update-modmium.sh.
#
# Override any of these by copying this file to:
#   /etc/modmium/modmium.conf        (system-wide, on-device)
#   ~/.config/modmium.conf           (per-user)
#   ./modmium.conf                   (per-project)
#
# Lines starting with # are comments. Uncomment a line to override.
# =============================================================================

# ---- Minimum supported ChromeOS milestone ----
#EZ_MIN_VERSION="131"

# ---- Firmware GBB flags set by devfw flashing ----
#EZ_GBB_FLAGS="0xa0b1"

# ---- TPM index holding the kernel version ----
#EZ_TPM_KERNVER_INDEX="0x1008"

# ---- Network endpoints ----
# JSON mapping board+version -> recovery image URL (served via jsDelivr CDN)
#EZ_RELEASES_JSON_URL="https://cdn.jsdelivr.net/gh/crosbreaker/chromeos-releases-data/data.json"

# On-device installer endpoints (hosted on crosbreaker CDN)
#EZ_MODMIUM_SH_URL="https://raw.githubusercontent.com/PlanetDogeCodes/EZ-Modmium/stable/modmium.sh"
#EZ_FWMP_SH_URL="https://modmium.dev/fwmp.sh"
#EZ_STREAM_PY_URL="https://raw.githubusercontent.com/PlanetDogeCodes/EZ-Modmium/stable/mod-files/usr/bin/stream.py"

# HWWP disabling guide
#EZ_HWWP_GUIDE_URL="https://crosmium.dev/HWWP"

# ---- Board lists (space-separated) ----
# Add your board here if it's missing, or restrict to a subset for a fleet.
#EZ_BOARDS="ambassador arkham asuka asurada atlas ... zork"
#EZ_MINIOS_BOARDS="brask brox brya cherry corsola geralt guybrush jedi nissa ovis rauru rex skyrim skywalker staryu"

# ---- Logging ----
#EZ_LOG_ENABLED="1"            # set 0 to disable file logging
#EZ_LOG_QUIET="0"              # set 1 to suppress stdout (CI mode)
#EZ_LOG_DEBUG="0"              # set 1 for verbose debug logging
#EZ_LOG_DIR="/var/log/modmium"
#EZ_LOG_FILE=""                # auto-set if empty

# ---- Non-interactive mode ----
#EZ_YES="0"                    # set 1 to auto-accept all confirmations (CI/fleet)

# ---- Force color output even when piped ----
#EZ_FORCE_COLOR="0"            # set 1 to always emit ANSI color codes
